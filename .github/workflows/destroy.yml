name: Terraform Destroy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - hom
          - prod
      confirm:
        description: 'Type the environment name again to confirm destruction (e.g. "prod")'
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  destroy:
    name: "Destroy ${{ inputs.environment }}"
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}-apply   # GitHub Environment com reviewer obrigatorio
    steps:
      - name: Validate confirmation input
        run: |
          if [ "${{ inputs.confirm }}" != "${{ inputs.environment }}" ]; then
            echo "Confirmation text '${{ inputs.confirm }}' does not match environment '${{ inputs.environment }}'. Aborting."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-pos_tech_fiap_db
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Terraform Init
        run: terraform init -backend-config=envs/${{ inputs.environment }}-backend.hcl

      - name: Select workspace
        run: terraform workspace select -or-create ${{ inputs.environment }}

      - name: Terraform validate
        run: terraform validate

      - name: Show destroy plan
        run: terraform plan -destroy -var-file=envs/${{ inputs.environment }}.tfvars

      - name: Destroy resources
        run: terraform destroy -var-file=envs/${{ inputs.environment }}.tfvars -auto-approve
